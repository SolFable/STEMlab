[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "stemlab"
version = "0.2.0"
description = "A desktop STEM laboratory with reproducible numerical experiments"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6>=6.10,<7"]

[project.scripts]
stemlab = "stemlab.__main__:main"
stemlab-desktop = "stemlab.desktop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stemlab = ["schemas/*.json", "desktop/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
